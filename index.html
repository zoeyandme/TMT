function FlagWindowScreen({ board, playerSymbol, playerFlagUsed, opponentFlagUsed, onThrowFlag, onExpire, squareIdx, playerName }) {
  const [timeLeft, setTimeLeft] = useState(10);
  const opponentSym = playerSymbol === "X" ? "O" : "X";
  // In human vs human, current viewer is the non-winner (opponent)
  const canThrow = !opponentFlagUsed;

  useEffect(() => {
    const t = setInterval(() => {
      setTimeLeft(p => {
        if (p <= 1) { clearInterval(t); onExpire(); return 0; }
        return p - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={styles.screen}>
      <div style={{ display:"flex", justifyContent:"space-between", width:"100%", marginBottom:8 }}>
        <h2 style={{ ...styles.sectionTitle, margin:0 }}>Challenge Window</h2>
        <span style={{ ...styles.timerBadge, color: timeLeft <= 3 ? "#EF4444" : "#F59E0B" }}>{timeLeft}s</span>
      </div>
      <Board board={board} playerSymbol={playerSymbol} interactive={false} lastPlacedIdx={squareIdx} />
      <div style={{ width:"100%", marginTop:16 }}>
        {canThrow ? (
          <>
            <p style={{ color:"#F59E0B", fontWeight:700, fontSize:15, textAlign:"center", marginBottom:12 }}>
              Think they guessed? Throw the flag!
            </p>
            <button style={{ ...styles.btn, background:"#EF4444", fontSize:18, padding:"16px" }}
              onClick={() => onThrowFlag(opponentSym)}>
              🏁 Not So Fast!
            </button>
            <button style={{ ...styles.btn, background:"#374151", marginTop:10, fontSize:14 }} onClick={onExpire}>
              Let It Stand
            </button>
          </>
        ) : (
          <p style={{ color:"#6B7280", textAlign:"center" }}>Flag already used this game.</p>
        )}
      </div>
    </div>
  );
}

        {defenderWon ? `${defenderName} Proved It!` : `${challengerName} Was Right!`}
      </h2>
      <div style={styles.correctAnswerBox}>
        <span style={{ color:"#9CA3AF", fontSize:13 }}>Correct Answer</span>
        <span style={{ color:"#22C55E", fontSize:28, fontWeight:900 }}>{correct}</span>
      </div>
      <p style={{ color:"#9CA3AF", fontSize:13, marginTop:8 }}>
        {defenderWon
          ? `${defenderName} answered correctly — choose a square to erase!`
          : `${challengerName} wins the challenge — choose a square to erase!`}
      </p>
    </div>
  );
}

// ── Erase Square Screen ────────────────────────────────────────────────────
function EraseSquareScreen({ board, playerSymbol, winnerSym, onErase, onDefault, playerName }) {
  const [timeLeft, setTimeLeft] = useState(10);
  const loserSym = winnerSym === playerSymbol ? (playerSymbol === "X" ? "O" : "X") : playerSymbol;
  const erasable = board.map((c, i) => c === loserSym ? i : -1).filter(i => i >= 0);

  useEffect(() => {
    const t = setInterval(() => {
      setTimeLeft(p => {
        if (p <= 1) { clearInterval(t); onDefault(); return 0; }
        return p - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={styles.screen}>
      <div style={{ display:"flex", justifyContent:"space-between", width:"100%", marginBottom:8 }}>
        <h2 style={{ ...styles.sectionTitle, margin:0 }}>Choose a Square to Erase</h2>
        <span style={{ ...styles.timerBadge, color: timeLeft <= 3 ? "#EF4444" : "#F59E0B" }}>{timeLeft}s</span>
      </div>
      <p style={{ color:"#9CA3AF", fontSize:13, marginBottom:12 }}>Tap one of your opponent's squares to erase it. Defaults to their last square in {timeLeft}s.</p>
      <div style={styles.board}>
        {board.map((cell, i) => {
          const isErasable = erasable.includes(i);
          return (
            <div key={i} style={{
              ...styles.cell,
              cursor: isErasable ? "pointer" : "default",
              background: isErasable ? "#5a1a1a" : cell ? "#1E3A5F" : "#1F2937",
              borderColor: isErasable ? "#EF4444" : "#374151",
              animation: isErasable ? "pulseRed 1s infinite" : "none",
            }}
              onClick={() => isErasable && onErase(i)}>
              {cell && <span style={{ fontSize:28, fontWeight:900, color: cell === playerSymbol ? "#60A5FA" : "#F87171" }}>{cell}</span>}
              {isErasable && <span style={{ position:"absolute", fontSize:20 }}>🧹</span>}
            </div>
          );
        })}
      </div>
      <style>{`@keyframes pulseRed { 0%,100%{box-shadow:0 0 0 0 #EF444455} 50%{box-shadow:0 0 12px 4px #EF444455} }`}</style>
    </div>
  );
}

// ── Erase Reveal Screen ────────────────────────────────────────────────────
function EraseRevealScreen({ board, playerSymbol, erasedIdx }) {
  return (
    <div style={styles.screen}>
      <p style={{ color:"#F59E0B", fontWeight:800, fontSize:18, marginBottom:8 }}>Square Erased! 🧹</p>
      <Board board={board} playerSymbol={playerSymbol} interactive={false} erasedIdx={erasedIdx} />
      <p style={{ color:"#6B7280", fontSize:13, marginTop:12 }}>Continuing in 3 seconds...</p>
    </div>
  );
}

function GameOverScreen({ winner, playerName, botName, board, playerSymbol, botSymbol, onRematch, onMenu, showGuestPrompt, onSignIn, newAchievements }) {
  const emoji = winner === "player" ? "🥳" : winner === "bot" ? "😕" : "🤝";
  const message = winner === "player"
    ? `${playerName} Wins!`
    : winner === "bot"
    ? `${botName} Wins!`
    : winner === "timeout"
    ? "Game Timed Out"
    : "It's a Draw!";

  const pSquares = board.filter(c => c === playerSymbol).length;
  const bSquares = board.filter(c => c === botSymbol).length;

  return (
    <div style={styles.screen}>
      <div style={{ fontSize: 72 }}>{emoji}</div>
      <h2 style={{ ...styles.sectionTitle, color: winner === "player" ? "#22C55E" : winner === "bot" ? "#EF4444" : "#F59E0B" }}>
        {message}
      </h2>
      <Board board={board} playerSymbol={playerSymbol} interactive={false} />
      <div style={{ display: "flex", gap: 24, marginTop: 16 }}>
        <div style={styles.statBox}>
          <p style={{ color: "#9CA3AF", fontSize: 12, margin: 0 }}>{playerName}</p>
          <p style={{ color: "#E5E7EB", fontSize: 22, fontWeight: 900, margin: 0 }}>{pSquares} squares</p>
        </div>
        <div style={styles.statBox}>
          <div style={{ display: "flex", justifyContent: "center" }}><WeldonAvatar size={32} /></div>
          <p style={{ color: "#9CA3AF", fontSize: 12, margin: 0 }}>{botName}</p>
          <p style={{ color: "#E5E7EB", fontSize: 22, fontWeight: 900, margin: 0 }}>{bSquares} squares</p>
        </div>
      </div>

      {/* Achievement unlocks */}
      {newAchievements && newAchievements.length > 0 && (
        <div style={{ width:"100%", background:"#1a2a1a", border:"1px solid #22C55E", borderRadius:12, padding:"12px 14px", marginTop:8 }}>
          <p style={{ color:"#22C55E", fontWeight:800, fontSize:13, margin:"0 0 8px" }}>🏅 Achievement Unlocked!</p>
          {newAchievements.map(a => (
            <div key={a.id} style={{ display:"flex", alignItems:"center", gap:10, marginBottom:4 }}>
              <span style={{ fontSize:24 }}>{a.icon}</span>
              <div>
                <p style={{ color:"#F9FAFB", fontWeight:700, fontSize:14, margin:0 }}>{a.name}</p>
                <p style={{ color:"#9CA3AF", fontSize:11, margin:0 }}>{a.desc}</p>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Guest prompt */}
      {showGuestPrompt && (
        <div style={{ width:"100%", background:"#1F2937", borderRadius:12, padding:"12px 14px", border:"1px solid #F59E0B", marginTop:8 }}>
          <p style={{ color:"#22C55E", fontWeight:600, fontSize:13, margin:"0 0 8px" }}>*Sign in to save your stats!</p>
          <button style={{ ...styles.btn, background:"white", color:"#111827", fontSize:13, padding:"9px 14px", display:"flex", alignItems:"center", gap:8, justifyContent:"center" }} onClick={onSignIn}>
            <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6.1C12.4 13 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L2.5 13.3A23.9 23.9 0 0 0 0 24c0 3.8.9 7.4 2.5 10.6l8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2.1 1.4-4.7 2.3-7.7 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.5 42.5 14.6 48 24 48z"/></svg>
            Sign In With Google
          </button>
        </div>
      )}

      <div style={{ display: "flex", gap: 12, marginTop: 16, width: "100%" }}>
        <button style={{ ...styles.btn, flex: 1, background: "#22C55E" }} onClick={onRematch}>🔄 Rematch</button>
        <button style={{ ...styles.btn, flex: 1, background: "#374151" }} onClick={onMenu}>🏠 Menu</button>
      </div>
    </div>
  );
}

function BoardPauseScreen({ board, playerSymbol, lastPlacedIdx, botName }) {
  const [count, setCount] = useState(3);
  useEffect(() => {
    const t = setInterval(() => setCount(p => p - 1), 1000);
    return () => clearInterval(t);
  }, []);
  const placedBy = board[lastPlacedIdx] === playerSymbol ? "You claimed" : `${botName} claimed`;
  return (
    <div style={styles.screen}>
      <p style={{ color: "#F59E0B", fontWeight: 800, fontSize: 18, margin: "0 0 8px" }}>
        {lastPlacedIdx !== null ? `${placedBy} a square!` : "Board Update"}
      </p>
      <Board board={board} playerSymbol={playerSymbol} interactive={false} lastPlacedIdx={lastPlacedIdx} />
      <p style={{ color: "#6B7280", fontSize: 13, marginTop: 12 }}>Continuing in {count}...</p>
    </div>
  );
}

function Board({ board, playerSymbol, onPick, interactive, lastPlacedIdx, erasedIdx }) {
  const botSymbol = playerSymbol === "X" ? "O" : "X";
  return (
    <div style={styles.board}>
      {board.map((cell, i) => {
        const isNew = i === lastPlacedIdx;
        const isErased = i === erasedIdx;
        return (
          <div
            key={i}
            style={{
              ...styles.cell,
              cursor: interactive && !cell ? "pointer" : "default",
              background: isErased ? "#2D1515"
                : isNew ? (cell === playerSymbol ? "#1a4a8a" : "#5a1a1a")
                : cell ? (cell === playerSymbol ? "#1E3A5F" : "#3B1F1F") : "#1F2937",
              borderColor: isErased ? "#EF4444"
                : isNew ? (cell === playerSymbol ? "#60A5FA" : "#F87171")
                : interactive && !cell ? "#4B5563" : "#374151",
              boxShadow: isNew ? `0 0 12px 3px ${cell === playerSymbol ? "#3B82F6" : "#EF4444"}55`
                : isErased ? "0 0 16px 4px #EF444488" : "none",
              transform: isNew ? "scale(1.08)" : isErased ? "scale(0.9)" : "scale(1)",
              transition: "all 0.3s ease",
              position: "relative",
            }}
            onClick={() => interactive && !cell && onPick && onPick(i)}
          >
            {isErased && (
              <span style={{ fontSize:32, animation:"eraserWipe 0.5s ease forwards" }}>🧹</span>
            )}
            {!isErased && cell && (
              <span style={{
                fontSize: 28, fontWeight: 900,
                color: cell === playerSymbol ? "#60A5FA" : "#F87171",
                animation: isNew ? "popIn 0.3s ease" : "none",
              }}>
                {cell}
              </span>
            )}
            {interactive && !cell && <span style={{ color: "#374151", fontSize: 22 }}>+</span>}
          </div>
        );
      })}
      <style>{`
        @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
        @keyframes eraserWipe { 0%{transform:rotate(-20deg) scale(1.2);opacity:1} 100%{transform:rotate(20deg) scale(0.8);opacity:0} }
      `}</style>
    </div>
  );
}
