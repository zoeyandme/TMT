const SKILL_LEVELS = [
  { name: "Star",      icon: "⭐", min: 0,  max: 4  },
  { name: "Scholar",   icon: "📚", min: 5,  max: 14 },
  { name: "Guru",      icon: "🧠", min: 15, max: 29 },
  { name: "Genius",    icon: "💡", min: 30, max: 49 },
  { name: "Professor", icon: "🎓", min: 50, max: Infinity },
];

function getSkillLevel(wins) {
  return SKILL_LEVELS.find(l => wins >= l.min && wins <= l.max) || SKILL_LEVELS[0];
}

// ── Achievement Badges ────────────────────────────────────────────────────
const ACHIEVEMENTS = [
  { id: "ace",         icon: "🎯",  name: "Ace",            desc: "Won your first game!" },
  { id: "whizkid",     icon: "👧🏾", name: "Whiz Kid",       desc: "Won 10 games!" },
  { id: "mathlete",    icon: "🏃",  name: "Mathlete",        desc: "Won 25 games!" },
  { id: "brainiac",    icon: "🧠",  name: "Brainiac",        desc: "50 correct answers at 85%+ accuracy!" },
  { id: "ninja",       icon: "🥷",  name: "Number Ninja",    desc: "Won a game with TWO TicMathToe lines!" },
  { id: "magician",    icon: "🪄",  name: "MathMagician",    desc: "Won 3 games with zero wrong answers!" },
  { id: "notsofast",   icon: "🏁",  name: "Not So Fast",     desc: "Threw 5 flags across all games!" },
  { id: "pinocchio",   icon: "🤥",  name: "Pinocchio",       desc: "Forfeited 3 remote matches." },
  { id: "challengejudge", icon: "⚖️", name: "Challenge Judge", desc: "Won 3 challenge flags." },
  { id: "teacherspet", icon: "🍎",  name: "Teacher's Pet",   desc: "Completed 2+ games daily for 10 days in a row!" },
];

function checkAchievements(prevStats, newStats, isDoubleWin, isPerfectGame, perfectWins) {
  const earned = [];
  const has = (id) => !!(prevStats[id] || (prevStats.badges || []).includes(id));
  if (!has("ace")         && newStats.wins >= 1)   earned.push("ace");
  if (!has("whizkid")     && newStats.wins >= 10)  earned.push("whizkid");
  if (!has("mathlete")    && newStats.wins >= 25)  earned.push("mathlete");
  if (!has("brainiac")    && newStats.correctAnswers >= 50 && newStats.accuracy >= 0.85) earned.push("brainiac");
  if (!has("ninja")       && isDoubleWin)          earned.push("ninja");
  if (!has("magician")    && perfectWins >= 3)     earned.push("magician");
  if (!has("notsofast")   && (newStats.flagsThrown || 0) >= 5)  earned.push("notsofast");
  if (!has("pinocchio")   && (newStats.forfeits || 0) >= 3)      earned.push("pinocchio");
  if (!has("challengejudge") && (newStats.challengeWins || 0) >= 3) earned.push("challengejudge");
  if (!has("teacherspet") && (newStats.streak || 0) >= 10)      earned.push("teacherspet");
  return earned.map(id => ACHIEVEMENTS.find(a => a.id === id)).filter(Boolean);
}


function getBadgeIdsFromStats(currentStats, nextStats, extras = {}) {
  const existing = currentStats.badges || [];
  const combined = { ...currentStats, ...nextStats };
  const earned = [];
  const add = (id, condition) => {
    if (condition && !existing.includes(id) && !earned.includes(id)) earned.push(id);
  };
  add("ace", (combined.wins || 0) >= 1);
  add("whizkid", (combined.wins || 0) >= 10);
  add("mathlete", (combined.wins || 0) >= 25);
  add("brainiac", (combined.correctAnswers || 0) >= 50 && (combined.accuracy || 0) >= 0.85);
  add("ninja", !!extras.isDoubleWin);
  add("magician", !!extras.isPerfectGame && (extras.perfectWins || 0) >= 3);
  add("notsofast", (combined.flagsThrown || 0) >= 5);
  add("pinocchio", (combined.forfeits || 0) >= 3);
  add("challengejudge", (combined.challengeWins || 0) >= 3);
  add("teacherspet", (combined.streak || 0) >= 10);
  return [...new Set([...existing, ...earned])];
}

// ── Google Auth Hook ───────────────────────────────────────────────────────
function useGoogleAuth() {
  const [user, setUser] = useState(null);
  const [stats, setStats] = useState({ wins: 0, losses: 0, cats: 0, forfeits: 0, challengeWins: 0, flagsThrown: 0, streak: 0, dailyGames: 0, lastPlayedDate: null, badges: [] });
  const [authLoading, setAuthLoading] = useState(true);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (firebaseUser) => {
      if (firebaseUser) {
        const u = { name: firebaseUser.displayName, email: firebaseUser.email, photoURL: firebaseUser.photoURL, uid: firebaseUser.uid };
        setUser(u);
        await loadStats(firebaseUser.uid);
      } else {
        setUser(null);
        setStats({ wins: 0, losses: 0, cats: 0, forfeits: 0, challengeWins: 0, flagsThrown: 0, streak: 0, dailyGames: 0, lastPlayedDate: null, badges: [] });
      }
      setAuthLoading(false);
    });
    return () => unsub();
  }, []);

  async function loadStats(uid) {
    try {
      const snap = await db.collection("users").doc(uid).get();
      if (snap.exists) {
        setStats(snap.data());
      } else {
        const initial = { wins: 0, losses: 0, cats: 0, forfeits: 0, challengeWins: 0, flagsThrown: 0, streak: 0, dailyGames: 0, lastPlayedDate: null, badges: [] };
        await db.collection("users").doc(uid).set(initial);
        setStats(initial);
      }
    } catch(e) { console.error("loadStats:", e); }
  }

  async function signIn() {
    try {
      await auth.signInWithPopup(googleProvider);
    } catch(e) { console.error("signIn:", e); }
  }

  async function signOut() {
    try {
      await auth.signOut();
    } catch(e) { console.error("signOut:", e); }
  }

  async function recordResult(result, uid, extras = {}) {
    try {
      const today = new Date().toDateString();
      const ref = db.collection("users").doc(uid);
      const snap = await ref.get();
      const current = snap.exists ? snap.data() : {};
      const last = current.lastPlayedDate;
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      let newStreak = current.streak || 0;
      let dailyGames = current.dailyGames || 0;

      if (last === today) {
        dailyGames += 1;
      } else if (last === yesterday) {
        dailyGames = 1;
      } else {
        dailyGames = 1;
        newStreak = 0;
      }
      if (dailyGames === 2) newStreak += 1;

      const next = {
        ...current,
        wins:   (current.wins   || 0) + (result === "win"  ? 1 : 0),
        losses: (current.losses || 0) + (result === "loss" ? 1 : 0),
        cats:   (current.cats   || 0) + (result === "cat"  ? 1 : 0),
        lastPlayedDate: today,
        dailyGames,
        streak: newStreak,
      };
      next.badges = getBadgeIdsFromStats(current, next, extras);
      await ref.set(next, { merge: true });
      setStats(next);
    } catch(e) { console.error("recordResult:", e); }
  }

  async function recordFlag(uid) {
    try {
      await db.collection("users").doc(uid).update({ flagsThrown: firebase.firestore.FieldValue.increment(1) });
      setStats(prev => ({ ...prev, flagsThrown: (prev.flagsThrown || 0) + 1 }));
    } catch(e) { console.error("recordFlag:", e); }
  }

  async function recordForfeit(uid) {
    try {
      const ref = db.collection("users").doc(uid);
      const snap = await ref.get();
      const current = snap.exists ? snap.data() : {};
      const nextForfeits = (current.forfeits || 0) + 1;
      const nextBadges = getBadgeIdsFromStats(current, { ...current, forfeits: nextForfeits });
      await ref.set({ forfeits: nextForfeits, badges: nextBadges }, { merge: true });
      setStats(prev => ({ ...prev, forfeits: nextForfeits, badges: nextBadges }));
    } catch(e) { console.error("recordForfeit:", e); }
  }

  async function recordChallengeWin(uid) {
    try {
      const ref = db.collection("users").doc(uid);
      const snap = await ref.get();
      const current = snap.exists ? snap.data() : {};
      const nextChallengeWins = (current.challengeWins || 0) + 1;
      const nextBadges = getBadgeIdsFromStats(current, { ...current, challengeWins: nextChallengeWins });
      await ref.set({ challengeWins: nextChallengeWins, badges: nextBadges }, { merge: true });
      setStats(prev => ({ ...prev, challengeWins: nextChallengeWins, badges: nextBadges }));
    } catch(e) { console.error("recordChallengeWin:", e); }
  }

  return { user, stats, signIn, signOut, recordResult, recordFlag, recordForfeit, recordChallengeWin, authLoading };
}


const WELDON_TIMES = { easy: 4200, average: 7500, hard: 12000 };
const WELDON_VARIANCE = 0.25;
const WELDON_ACCURACY = { easy: [0.85, 0.90], average: [0.80, 0.85], hard: [0.75, 0.80] };
const QUESTION_TIMEOUTS = { easy: 60000, average: 120000, hard: 180000 };

function weldonAccuracy(level) {
  const [min, max] = WELDON_ACCURACY[level];
  return min + Math.random() * (max - min);
}

function checkDoubleWin(board, sym) {
  const lines = WIN_LINES.filter(([a,b,c]) => board[a]===sym && board[b]===sym && board[c]===sym);
  return lines.length >= 2;
}

// Win patterns
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6],
];

function checkWinner(board) {
  for (const [a,b,c] of WIN_LINES) {
    if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
  }
  return null;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getQuestionKey(level, q, index) {
  return `${level}:${String(q.q).trim()}|${String(q.a).trim()}`;
}

function getQuestion(level, usedIds = []) {
  const bank = QUESTION_BANKS[level] || QUESTION_BANKS.easy;
  const used = new Set(usedIds.map(String));
  const available = bank
    .map((q, i) => ({ q, i, key: getQuestionKey(level, q, i) }))
    .filter(item => !used.has(item.key) && !used.has(String(item.i)));
  const pool = available.length > 0
    ? available
    : bank.map((q, i) => ({ q, i, key: getQuestionKey(level, q, i) }));
  const picked = pool[Math.floor(Math.random() * pool.length)];
  return { ...picked.q, choices: shuffle(picked.q.choices), id: picked.key };
}

const PHASES = {

  COIN_FLIP: "coin_flip",
  READY: "ready",
  QUESTION: "question",
  ROUND_RESULT: "round_result",
  PICK_SQUARE: "pick_square",
  BOARD_PAUSE: "board_pause",
  FLAG_WINDOW: "flag_window",       // 10s window to throw flag
  CHALLENGE_QUESTION: "challenge_question", // defender answers
  CHALLENGE_RESULT: "challenge_result",     // show who won challenge
  ERASE_SQUARE: "erase_square",     // winner picks square to erase
  ERASE_REVEAL: "erase_reveal",     // show board after erasure
  PICK_DIFF_AFTER_CHALLENGE: "pick_diff_after_challenge",
  GAME_OVER: "game_over",
};

const DIFFICULTIES = ["easy", "average", "hard"];
const DIFF_LABELS = { easy: "Easy", average: "Average", hard: "Hard" };
const DIFF_COLORS = { easy: "#22C55E", average: "#F59E0B", hard: "#EF4444" };

function TicMathToe() {
  const { user, stats, signIn, signOut, recordResult, recordFlag, recordForfeit, recordChallengeWin, authLoading } = useGoogleAuth();
  const [showGuestPrompt, setShowGuestPrompt] = useState(false);
  const [guestMode, setGuestMode] = useState(false);
  const [phase, setPhase] = useState(PHASES.MENU);
  const [mode, setMode] = useState(null); // "bot" | "multiplayer"
  const [playerName, setPlayerName] = useState("");
  const [nameInput, setNameInput] = useState("");

  // Game state
  const [board, setBoard] = useState(Array(9).fill(null));
  const [playerSymbol, setPlayerSymbol] = useState("X");
  const [currentTurn, setCurrentTurn] = useState(null); // symbol whose turn to pick
  const [difficulty, setDifficulty] = useState("easy");
  const [currentQ, setCurrentQ] = useState(null);
  const [usedIds, setUsedIds] = useState([]);
  const [questionStartTime, setQuestionStartTime] = useState(null);

  // Round result
  const [roundResult, setRoundResult] = useState(null);
  // { playerAnswer, playerTime, botAnswer, botTime, correct, winner }

  // Scores
  const [scores, setScores] = useState({ player: 0, bot: 0 });
  const [winner, setWinner] = useState(null);
  const [newAchievements, setNewAchievements] = useState([]);
  const [sessionCorrect, setSessionCorrect] = useState(0);
  const [sessionTotal, setSessionTotal] = useState(0);
  const [sessionWrongAnswers, setSessionWrongAnswers] = useState(0);
  const [perfectWins, setPerfectWins] = useState(0); // games won with zero wrong answers

  // Player ready state
  const [playerReady, setPlayerReady] = useState(false);
  const [coinResult, setCoinResult] = useState(null);
  const [coinFlipping, setCoinFlipping] = useState(false);

  // Countdown
  const [countdown, setCountdown] = useState(null);
  const countdownRef = useRef(null);
  const weldonTimerRef = useRef(null);
  const resultTimerRef = useRef(null);
  const timeoutRef = useRef(null);
  const boardPauseRef = useRef(null);
  const questionTimeoutRef = useRef(null);
  const [lastPlacedIdx, setLastPlacedIdx] = useState(null);
  const [questionTimedOut, setQuestionTimedOut] = useState(false);

  // Player's selected answer
  const [playerAnswer, setPlayerAnswer] = useState(null);
  const [playerAnswerTime, setPlayerAnswerTime] = useState(null);
  const [weldonAnswered, setWeldonAnswered] = useState(false);
  const [weldonAnswer, setWeldonAnswer] = useState(null);
  const [weldonAnswerTime, setWeldonAnswerTime] = useState(null);

  // Flag/Challenge state
  const [playerFlagUsed, setPlayerFlagUsed] = useState(false);
  const [opponentFlagUsed, setOpponentFlagUsed] = useState(false);
  const [flagThrownBy, setFlagThrownBy] = useState(null); // symbol of challenger
  const [challengeQ, setChallengeQ] = useState(null);
  const [challengeAnswer, setChallengeAnswer] = useState(null);
  const [challengeWinner, setChallengeWinner] = useState(null); // "player"|"opponent"
  const [squareUnderChallenge, setSquareUnderChallenge] = useState(null);
  const [erasedIdx, setErasedIdx] = useState(null);
  const [lastPlacedHistory, setLastPlacedHistory] = useState([]); // track order of placed squares
  const flagWindowRef = useRef(null);
  const eraseTimerRef = useRef(null);

  const botName = "Weldon";
  const botSymbol = playerSymbol === "X" ? "O" : "X";

  // cleanup
  useEffect(() => {
    return () => {
      clearTimeout(weldonTimerRef.current);
      clearTimeout(resultTimerRef.current);
      clearInterval(countdownRef.current);
      clearTimeout(timeoutRef.current);
    };
  }, []);

  function startNewGame(selectedMode) {
    if (selectedMode === "pvp") {
      setMode("pvp");
      setPlayerName(user ? user.name : (nameInput || "Guest"));
      setPhase("remote_pvp");
      return;
    }
    setMode(selectedMode);
    setBoard(Array(9).fill(null));
    setScores({ player: 0, bot: 0 });
    setUsedIds([]);
    setWinner(null);
    setPlayerFlagUsed(false);
    setOpponentFlagUsed(false);
    setLastPlacedHistory([]);
    setErasedIdx(null);
    setPhase(PHASES.COIN_FLIP);
    flipCoin();
  }

  function flipCoin() {
    setCoinFlipping(true);
    setCoinResult(null);
    setTimeout(() => {
      const result = Math.random() < 0.5 ? "X" : "O";
      setPlayerSymbol(result);
      setCoinResult(result);
      setCoinFlipping(false);
    }, 1800);
  }

  function startRound(diff) {
    setDifficulty(diff);
    setPlayerReady(false);
    setPhase(PHASES.READY);
    // 8-hour timeout
    clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(() => {
      setWinner("timeout");
      setPhase(PHASES.GAME_OVER);
    }, 8 * 60 * 60 * 1000);
  }

  function handleReady() {
    setPlayerReady(true);
    // Small countdown then show question
    setCountdown(3);
    countdownRef.current = setInterval(() => {
      setCountdown(prev => {
        if (prev <= 1) {
          clearInterval(countdownRef.current);
          showQuestion();
          return null;
        }
        return prev - 1;
      });
    }, 1000);
  }

  function showQuestion() {
    const q = getQuestion(difficulty, usedIds);
    setCurrentQ(q);
    setPlayerAnswer(null);
    setPlayerAnswerTime(null);
    setWeldonAnswered(false);
    setWeldonAnswer(null);
    setWeldonAnswerTime(null);
    setQuestionTimedOut(false);
    setQuestionStartTime(Date.now());
    setPhase(PHASES.QUESTION);

    // Weldon's answer — occasionally answers much faster (25% chance)
    const baseTime = WELDON_TIMES[difficulty];
    const variance = baseTime * WELDON_VARIANCE;
    const isFastRound = Math.random() < 0.25;
    const weldonDelay = isFastRound
      ? baseTime * 0.35 + Math.random() * 800
      : baseTime + (Math.random() * variance * 2 - variance);
    const accuracy = weldonAccuracy(difficulty);

    weldonTimerRef.current = setTimeout(() => {
      const isCorrect = Math.random() < accuracy;
      const wAnswer = isCorrect ? q.a : q.choices.find(c => c !== q.a);
      setWeldonAnswered(true);
      setWeldonAnswer(wAnswer);
      setWeldonAnswerTime(Math.round(weldonDelay));
    }, weldonDelay);

    // 2-minute question timeout — if player hasn't answered, auto-resolve
    clearTimeout(questionTimeoutRef.current);
    questionTimeoutRef.current = setTimeout(() => {
      setQuestionTimedOut(true);
      setPlayerAnswer("timeout");
      setPlayerAnswerTime(QUESTION_TIMEOUTS[difficulty]);
      setTimeout(() => resolveRound("timeout", QUESTION_TIMEOUTS[difficulty]), 600);
    }, QUESTION_TIMEOUTS[difficulty]);
  }

  function handlePlayerAnswer(choice) {
    if (playerAnswer !== null) return;
    clearTimeout(questionTimeoutRef.current);
    const elapsed = Date.now() - questionStartTime;
    setPlayerAnswer(choice);
    setPlayerAnswerTime(elapsed);
    clearTimeout(weldonTimerRef.current);

    // Wait briefly to show both answered, then resolve
    setTimeout(() => {
      resolveRound(choice, elapsed);
    }, 600);
  }

  function resolveRound(pAnswer, pTime) {
    clearTimeout(questionTimeoutRef.current);
    const q = currentQ;
    const correct = q.a;
    const pCorrect = pAnswer !== "timeout" && pAnswer === correct;

    // Use Weldon's already-scheduled answer if available, else generate
    const baseTime = WELDON_TIMES[difficulty];
    const variance = baseTime * WELDON_VARIANCE;
    const isFastRound = Math.random() < 0.25;
    const wDelay = isFastRound
      ? baseTime * 0.35 + Math.random() * 800
      : baseTime + (Math.random() * variance * 2 - variance);
    const wCorrect = Math.random() < weldonAccuracy(difficulty);
    const wAnswer = wCorrect ? correct : q.choices.find(c => c !== correct);
    const wTime = Math.round(wDelay);

    setWeldonAnswer(wAnswer);
    setWeldonAnswerTime(wTime);

    // Track player's correct answers for achievements
    if (pCorrect) {
      setSessionCorrect(prev => prev + 1);
    } else if (pAnswer !== "timeout") {
      setSessionWrongAnswers(prev => prev + 1);
    }
    setSessionTotal(prev => prev + 1);

    let roundWinner = null;
    if (pAnswer === "timeout") {
      roundWinner = wCorrect ? "bot" : null;
    } else if (pCorrect && wCorrect) {
      roundWinner = pTime <= wTime ? "player" : "bot";
    } else if (pCorrect) {
      roundWinner = "player";
    } else if (wCorrect) {
      roundWinner = "bot";
    }

    setRoundResult({
      playerAnswer: pAnswer === "timeout" ? "⏱ Timed Out" : pAnswer,
      playerTime: pTime,
      weldonAnswer: wAnswer,
      weldonTime: wTime,
      correct,
      winner: roundWinner,
      playerTimedOut: pAnswer === "timeout",
    });

    setPhase(PHASES.ROUND_RESULT);

    resultTimerRef.current = setTimeout(() => {
      advanceAfterResult(roundWinner);
    }, 5000);
  }

  function advanceAfterResult(roundWinner) {
    clearTimeout(resultTimerRef.current);
    if (!roundWinner) {
      // No correct answer — repeat with new question
      const diff = difficulty; // keep same difficulty
      startRound(diff);
      return;
    }
    // Winner picks a square
    setCurrentTurn(roundWinner === "player" ? playerSymbol : botSymbol);
    setPhase(PHASES.PICK_SQUARE);

    // If bot won, auto-pick with visible board update
    if (roundWinner === "bot") {
      setTimeout(() => {
        autoBotPickSquare();
      }, 1200);
    }
  }

  function autoBotPickSquare() {
    setBoard(prev => {
      const empty = prev.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
      if (empty.length === 0) return prev;
      const sym = botSymbol;
      const pSym = playerSymbol;

      // 1. Win if possible
      for (const [a,b,c] of WIN_LINES) {
        if (prev[a] === sym && prev[b] === sym && prev[c] === null) { placeAndContinue(c, sym); return prev; }
        if (prev[a] === sym && prev[c] === sym && prev[b] === null) { placeAndContinue(b, sym); return prev; }
        if (prev[b] === sym && prev[c] === sym && prev[a] === null) { placeAndContinue(a, sym); return prev; }
      }
      // 2. Block player from winning
      for (const [a,b,c] of WIN_LINES) {
        if (prev[a] === pSym && prev[b] === pSym && prev[c] === null) { placeAndContinue(c, sym); return prev; }
        if (prev[a] === pSym && prev[c] === pSym && prev[b] === null) { placeAndContinue(b, sym); return prev; }
        if (prev[b] === pSym && prev[c] === pSym && prev[a] === null) { placeAndContinue(a, sym); return prev; }
      }
      // 3. Create a fork (two ways to win)
      const corners = [0,2,6,8].filter(i => prev[i] === null);
      const center = 4;
      const edges = [1,3,5,7].filter(i => prev[i] === null);
      for (const fork of empty) {
        const test = [...prev]; test[fork] = sym;
        let wins = 0;
        for (const [a,b,c] of WIN_LINES) {
          if (test[a]===sym && test[b]===sym && test[c]===null) wins++;
          if (test[a]===sym && test[c]===sym && test[b]===null) wins++;
          if (test[b]===sym && test[c]===sym && test[a]===null) wins++;
        }
        if (wins >= 2) { placeAndContinue(fork, sym); return prev; }
      }
      // 4. Take center
      if (prev[center] === null) { placeAndContinue(center, sym); return prev; }
      // 5. Take opposite corner from player
      const oppCorners = [[0,8],[2,6],[6,2],[8,0]];
      for (const [mine, opp] of oppCorners) {
        if (prev[opp] === pSym && prev[mine] === null) { placeAndContinue(mine, sym); return prev; }
      }
      // 6. Take any corner
      if (corners.length > 0) { placeAndContinue(corners[Math.floor(Math.random()*corners.length)], sym); return prev; }
      // 7. Take any edge
      if (edges.length > 0) { placeAndContinue(edges[Math.floor(Math.random()*edges.length)], sym); return prev; }
      // 8. Fallback
      placeAndContinue(empty[Math.floor(Math.random()*empty.length)], sym);
      return prev;
    });
  }

  function placeAndContinue(idx, sym) {
    setBoard(prev => {
      const next = [...prev];
      next[idx] = sym;
      setLastPlacedIdx(idx);
      setLastPlacedHistory(h => [...h, { idx, sym }]);
      const w = checkWinner(next);
      const filled = next.every(c => c !== null);
      if (w || filled) {
        setPhase(PHASES.BOARD_PAUSE);
        boardPauseRef.current = setTimeout(() => {
          endGame(next, w);
        }, 3000);
      } else {
        setPhase(PHASES.BOARD_PAUSE);
        boardPauseRef.current = setTimeout(() => {
          setLastPlacedIdx(null);
          // Flag window only for human vs human
          if (mode === "multiplayer") {
            setSquareUnderChallenge(idx);
            setPhase(PHASES.FLAG_WINDOW);
          } else {
            if (sym === playerSymbol) {
              setPhase("pick_difficulty");
            } else {
              const nextDiff = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];
              startRound(nextDiff);
            }
          }
        }, 3000);
      }
      return next;
    });
  }

  function handlePlayerPickSquare(idx) {
    if (board[idx] !== null) return;
    const next = [...board];
    next[idx] = playerSymbol;
    setBoard(next);
    setLastPlacedIdx(idx);
    setLastPlacedHistory(h => [...h, { idx, sym: playerSymbol }]);
    const w = checkWinner(next);
    const filled = next.every(c => c !== null);
    setPhase(PHASES.BOARD_PAUSE);
    boardPauseRef.current = setTimeout(() => {
      setLastPlacedIdx(null);
      if (w || filled) {
        endGame(next, w);
      } else if (mode === "multiplayer") {
        setSquareUnderChallenge(idx);
        setPhase(PHASES.FLAG_WINDOW);
      } else {
        setPhase("pick_difficulty");
      }
    }, 3000);
  }

  // ── Flag/Challenge Handlers ───────────────────────────────────────────
  function handleThrowFlag(challengerSym) {
    clearTimeout(flagWindowRef.current);
    if (challengerSym === playerSymbol) setPlayerFlagUsed(true);
    else setOpponentFlagUsed(true);
    setFlagThrownBy(challengerSym);
    // Record flag for badge tracking
    if (user) recordFlag(user.uid);
    const q = getQuestion(difficulty, usedIds);
    setChallengeQ(q);
    setChallengeAnswer(null);
    setChallengeWinner(null);
    setPhase(PHASES.CHALLENGE_QUESTION);
  }

  function handleFlagWindowExpire() {
    clearTimeout(flagWindowRef.current);
    // No flag thrown — continue normally
    const lastEntry = lastPlacedHistory[lastPlacedHistory.length - 1];
    if (lastEntry?.sym === playerSymbol) {
      setPhase("pick_difficulty");
    } else {
      const nextDiff = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];
      startRound(nextDiff);
    }
  }

  function handleChallengeAnswer(choice) {
    if (challengeAnswer !== null) return;
    setChallengeAnswer(choice);
    const correct = challengeQ.a;
    const defenderCorrect = choice === correct;
    // Defender is the square winner (lastPlacedHistory last entry)
    const defenderSym = lastPlacedHistory[lastPlacedHistory.length - 1]?.sym;
    const winner = defenderCorrect ? "defender" : "challenger";
    setChallengeWinner(winner);

    setTimeout(() => {
      // Check if defender wins and already has winning board
      if (winner === "defender") {
        const w = checkWinner(board);
        if (w === defenderSym) {
          endGame(board, defenderSym);
          return;
        }
      }
      // Move to erase square selection
      setPhase(PHASES.ERASE_SQUARE);
    }, 2000);
  }

  function handleEraseSquare(idx) {
    clearTimeout(eraseTimerRef.current);
    setErasedIdx(idx);
    const next = [...board];
    next[idx] = null;
    // Remove from history
    setLastPlacedHistory(h => h.filter(e => e.idx !== idx));
    setBoard(next);
    setPhase(PHASES.ERASE_REVEAL);
    // Show updated board for 3 seconds then pick difficulty
    setTimeout(() => {
      setErasedIdx(null);
      setPhase(PHASES.PICK_DIFF_AFTER_CHALLENGE);
    }, 3000);
  }

  function handleEraseDefault() {
    // Default to opponent's last placed square
    const challengerSym = flagThrownBy;
    const defenderSym = challengerSym === playerSymbol ? botSymbol : playerSymbol;
    const challengeWon = challengeWinner === "defender";
    // Winner erases opponent's square
    const loserSym = challengeWon ? challengerSym : defenderSym;
    const loserSquares = lastPlacedHistory.filter(e => e.sym === loserSym);
    if (loserSquares.length > 0) {
      handleEraseSquare(loserSquares[loserSquares.length - 1].idx);
    } else {
      setPhase(PHASES.PICK_DIFF_AFTER_CHALLENGE);
    }
  }

  function endGame(finalBoard, winSymbol) {
    clearTimeout(timeoutRef.current);
    let result;
    let isDoubleWin = false;
    let isPerfectGame = sessionWrongAnswers === 0;

    if (!winSymbol) {
      const pCount = finalBoard.filter(c => c === playerSymbol).length;
      const bCount = finalBoard.filter(c => c === botSymbol).length;
      const w = pCount > bCount ? "player" : pCount < bCount ? "bot" : "cat";
      setWinner(w);
      result = w === "player" ? "win" : w === "bot" ? "loss" : "cat";
      isPerfectGame = isPerfectGame && w === "player";
    } else {
      const w = winSymbol === playerSymbol ? "player" : "bot";
      setWinner(w);
      result = w === "player" ? "win" : "loss";
      if (w === "player") {
        isDoubleWin = checkDoubleWin(finalBoard, playerSymbol);
        isPerfectGame = isPerfectGame && true;
      } else {
        isPerfectGame = false;
      }
    }

    // Update perfect wins count
    const newPerfectWins = isPerfectGame ? perfectWins + 1 : perfectWins;
    if (isPerfectGame) setPerfectWins(newPerfectWins);

    // Check achievements
    const prevStats = { ...stats };
    const newStats = {
      wins: stats.wins + (result === "win" ? 1 : 0),
      correctAnswers: sessionCorrect,
      accuracy: sessionTotal > 0 ? sessionCorrect / sessionTotal : 0,
      ace: false, whizkid: false, mathlete: false, brainiac: false, ninja: false, magician: false,
    };
    const earned = checkAchievements(prevStats, newStats, isDoubleWin, isPerfectGame, newPerfectWins);
    setNewAchievements(earned);

    if (user) {
      recordResult(result, user.uid);
      // Save newly earned badges to Firestore
      if (earned.length > 0) {
        const newBadgeIds = earned.map(a => a.id);
        const existingBadges = stats.badges || [];
        const allBadges = [...new Set([...existingBadges, ...newBadgeIds])];
        db.collection("users").doc(user.uid).set({ badges: allBadges }, { merge: true });
      }
    } else {
      setShowGuestPrompt(true);
    }
    setPhase(PHASES.GAME_OVER);
  }

  function handleDifficultyPick(diff) {
    startRound(diff);
  }

  // ── Render ─────────────────────────────────────────────────────────────
  if (authLoading) return (
    <div style={{ ...styles.app, flexDirection:"column", gap:16 }}>
      <Logo size={72} />
      <p style={{ color:"white", fontWeight:700, fontSize:18 }}>Loading...</p>
    </div>
  );

  return (
    <div style={styles.app}>
      <MathBackground />
      <div style={{ ...styles.container, position: "relative", zIndex: 1 }}>
        {phase === PHASES.MENU && <MenuScreen nameInput={nameInput} setNameInput={setNameInput} setPlayerName={setPlayerName} onStart={startNewGame} user={user} stats={stats} onSignIn={signIn} onSignOut={signOut} guestMode={guestMode} setGuestMode={setGuestMode} />}
        {phase === PHASES.COIN_FLIP && <CoinFlipScreen coinFlipping={coinFlipping} coinResult={coinResult} playerSymbol={playerSymbol} botName={botName} onContinue={() => startRound(DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)])} />}
        {phase === PHASES.READY && <ReadyScreen difficulty={difficulty} playerReady={playerReady} countdown={countdown} onReady={handleReady} playerName={playerName || "You"} botName={botName} />}
        {phase === PHASES.QUESTION && <QuestionScreen q={currentQ} playerAnswer={playerAnswer} onAnswer={handlePlayerAnswer} playerName={playerName || "You"} botName={botName} weldonAnswered={weldonAnswered} questionStartTime={questionStartTime} questionTimedOut={questionTimedOut} difficulty={difficulty} />}
        {phase === PHASES.ROUND_RESULT && <RoundResultScreen result={roundResult} playerName={playerName || "You"} botName={botName} playerSymbol={playerSymbol} onContinue={() => { clearTimeout(resultTimerRef.current); advanceAfterResult(roundResult.winner); }} />}
        {phase === PHASES.PICK_SQUARE && currentTurn === playerSymbol && (
          <PickSquareScreen board={board} playerSymbol={playerSymbol} onPick={handlePlayerPickSquare} playerName={playerName || "You"} />
        )}
        {phase === PHASES.PICK_SQUARE && currentTurn === botSymbol && (
          <WaitingScreen botName={botName} message="is choosing a square..." board={board} playerSymbol={playerSymbol} />
        )}
        {phase === PHASES.BOARD_PAUSE && (
          <BoardPauseScreen board={board} playerSymbol={playerSymbol} lastPlacedIdx={lastPlacedIdx} botName={botName} />
        )}
        {phase === PHASES.FLAG_WINDOW && (
          <FlagWindowScreen board={board} playerSymbol={playerSymbol} playerFlagUsed={playerFlagUsed} opponentFlagUsed={opponentFlagUsed} onThrowFlag={handleThrowFlag} onExpire={handleFlagWindowExpire} squareIdx={squareUnderChallenge} playerName={playerName || "You"} />
        )}
        {phase === PHASES.CHALLENGE_QUESTION && (
          <ChallengeQuestionScreen q={challengeQ} onAnswer={handleChallengeAnswer} challengeAnswer={challengeAnswer} defenderName={playerName || "You"} />
        )}
        {phase === PHASES.CHALLENGE_RESULT && (
          <ChallengeResultScreen challengeWinner={challengeWinner} defenderName={playerName || "You"} challengerName="Opponent" correct={challengeQ?.a} challengeAnswer={challengeAnswer} />
        )}
        {phase === PHASES.ERASE_SQUARE && (
          <EraseSquareScreen board={board} playerSymbol={playerSymbol} winnerSym={challengeWinner === "defender" ? playerSymbol : (playerSymbol === "X" ? "O" : "X")} onErase={handleEraseSquare} onDefault={handleEraseDefault} playerName={playerName || "You"} />
        )}
        {phase === PHASES.ERASE_REVEAL && (
          <EraseRevealScreen board={board} playerSymbol={playerSymbol} erasedIdx={erasedIdx} />
        )}
        {phase === PHASES.PICK_DIFF_AFTER_CHALLENGE && (
          <PickDifficultyScreen onPick={handleDifficultyPick} playerName={playerName || "You"} title="Challenge Winner Picks!" />
        )}
        {phase === "pick_difficulty" && (
          <PickDifficultyScreen onPick={handleDifficultyPick} playerName={playerName || "You"} />
        )}
        {phase === "remote_pvp" && (
          <RemotePvPScreen user={user} stats={stats} recordResult={recordResult} recordFlag={recordFlag} recordForfeit={recordForfeit} recordChallengeWin={recordChallengeWin} onSignIn={signIn} onMenu={() => setPhase(PHASES.MENU)} />
        )}
        {phase === PHASES.GAME_OVER && (
          <GameOverScreen winner={winner} playerName={playerName || "You"} botName={botName} board={board} playerSymbol={playerSymbol} botSymbol={botSymbol} onRematch={() => { setShowGuestPrompt(false); setNewAchievements([]); setSessionCorrect(0); setSessionTotal(0); setSessionWrongAnswers(0); startNewGame(mode); }} onMenu={() => { setShowGuestPrompt(false); setNewAchievements([]); setSessionWrongAnswers(0); setPhase(PHASES.MENU); }} showGuestPrompt={showGuestPrompt} onSignIn={signIn} newAchievements={newAchievements} />
        )}
      </div>
    </div>
  );
}

// ── Screens ────────────────────────────────────────────────────────────────


function makeRemoteRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function getRemotePlayerName(p) {
  return p?.name || "Waiting...";
}

function fmtTime(ms) {
  if (ms === null || ms === undefined) return "—";
  return `${(ms / 1000).toFixed(2)}s`;
}

function boardLeader(board, p1Symbol, p2Symbol) {
  const p1 = board.filter(c => c === p1Symbol).length;
  const p2 = board.filter(c => c === p2Symbol).length;
  if (p1 > p2) return "p1";
  if (p2 > p1) return "p2";
  return null;
}

function RemotePvPScreen({ user, stats, recordResult, recordFlag, recordForfeit, recordChallengeWin, onSignIn, onMenu }) {
  const [roomCode, setRoomCode] = useState("");
  const [joinCode, setJoinCode] = useState("");
  const [game, setGame] = useState(null);
  const [myKey, setMyKey] = useState(null);
  const [busy, setBusy] = useState(false);
  const [matchmaking, setMatchmaking] = useState(false);
  const [error, setError] = useState("");
  const [elapsed, setElapsed] = useState(0);
  const [localStartedAt, setLocalStartedAt] = useState(null);
  const [localSubmitted, setLocalSubmitted] = useState(false);
  const unsubRef = useRef(null);
  const queueUnsubRef = useRef(null);
  const leavingRef = useRef(false);
  const lastRoundIdRef = useRef(null);
  const challengeWinRecordedRef = useRef({});

  const otherKey = myKey === "p1" ? "p2" : "p1";
  const me = game?.players?.[myKey];
  const other = game?.players?.[otherKey];
  const mySymbol = me?.symbol || (myKey === "p1" ? "X" : "O");
  const otherSymbol = other?.symbol || (mySymbol === "X" ? "O" : "X");
  const questionLimit = QUESTION_TIMEOUTS[game?.difficulty || "easy"] || 120000;
  const attempts = game?.attempts || {};
  const myAttempt = attempts[myKey] || null;
  const otherAttempt = attempts[otherKey] || null;
  const localAttemptActive = game?.phase === "answering" && !!localStartedAt && !localSubmitted && !myAttempt?.endAt;
  const inCombat = game?.phase === "answering" && ((myAttempt?.status === "started" && !myAttempt?.endAt) || localAttemptActive);
  const myFlagUsed = !!(game?.flagsUsed?.[myKey] || (user?.uid && game?.challengeFlagsUsed?.[user.uid]));

  useEffect(() => () => { if (unsubRef.current) unsubRef.current(); if (queueUnsubRef.current) queueUnsubRef.current(); }, []);

  useEffect(() => {
    if (!game) return;
    const rid = game.roundId || 0;
    if (lastRoundIdRef.current !== rid) {
      lastRoundIdRef.current = rid;
      setElapsed(0);
      setLocalStartedAt(null);
      setLocalSubmitted(false);
      leavingRef.current = false;
    }
  }, [game?.roundId]);

  useEffect(() => {
    if (!inCombat) return;
    const startedMs = myAttempt?.startedAt?.toMillis ? myAttempt.startedAt.toMillis() : localStartedAt || Date.now();
    const t = setInterval(() => setElapsed(Date.now() - startedMs), 100);
    return () => clearInterval(t);
  }, [inCombat, myAttempt?.startedAt, localStartedAt]);

  useEffect(() => {
    if (!inCombat) return;
    if (elapsed >= questionLimit) submitAsyncAnswer("timeout");
  }, [elapsed, inCombat, questionLimit]);

  useEffect(() => {
    if (!game || game.phase !== "answering" || !roomCode) return;
    const a = game.attempts || {};
    if (a.p1?.endAt && a.p2?.endAt && !game.result && !game.resolving) {
      resolveAsyncRound(game);
    }
  }, [game?.attempts, game?.phase, game?.result, game?.resolving]);

  useEffect(() => {
    if (!game || game.phase !== "remoteFlagWindow" || !game.challenge) return;
    const createdMs = game.challenge.createdAt?.toMillis ? game.challenge.createdAt.toMillis() : Date.now();
    const remaining = Math.max(0, 10000 - (Date.now() - createdMs));
    const t = setTimeout(() => finalizeRemoteFlagWindow(), remaining);
    return () => clearTimeout(t);
  }, [game?.phase, game?.challenge?.createdAt, game?.challenge?.status]);

  useEffect(() => {
    if (!game || !user || !myKey || game.phase !== "remoteChallengeResult" || !game.challenge) return;
    if (game.challenge.winnerKey !== myKey) return;
    if (game.challenge.statsRecorded?.[myKey]) return;
    const key = game.challenge.challengeId || `${roomCode}_${game.roundId || 0}_${myKey}`;
    if (challengeWinRecordedRef.current[key]) return;
    challengeWinRecordedRef.current[key] = true;
    (async () => {
      try {
        if (recordChallengeWin) await recordChallengeWin(user.uid);
        await db.collection("pvpGames").doc(roomCode).update({
          [`challenge.statsRecorded.${myKey}`]: true,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      } catch(e) { console.error("recordChallengeWin remote", e); }
    })();
  }, [game?.phase, game?.challenge?.winnerKey, game?.challenge?.challengeId, myKey]);

  useEffect(() => {
    function handleLeave() {
      if (leavingRef.current) return;
      if (document.visibilityState === "hidden" && inCombat) {
        leavingRef.current = true;
        markLeftScreenLoss();
      }
    }
    function handleBlur() {
      if (leavingRef.current) return;
      if (inCombat) {
        leavingRef.current = true;
        markLeftScreenLoss();
      }
    }
    document.addEventListener("visibilitychange", handleLeave);
    window.addEventListener("pagehide", handleLeave);
    window.addEventListener("blur", handleBlur);
    return () => {
      document.removeEventListener("visibilitychange", handleLeave);
      window.removeEventListener("pagehide", handleLeave);
      window.removeEventListener("blur", handleBlur);
    };
  }, [inCombat, roomCode, myKey, game?.phase]);

  function watchRoom(code, key) {
    if (unsubRef.current) unsubRef.current();
    unsubRef.current = db.collection("pvpGames").doc(code).onSnapshot(snap => {
      if (!snap.exists) { setError("Game not found."); return; }
      setGame({ id: snap.id, ...snap.data() });
    }, e => setError(e.message));
    setRoomCode(code);
    setMyKey(key);
    setElapsed(0);
    setLocalStartedAt(null);
    setLocalSubmitted(false);
    leavingRef.current = false;
  }

  function listenForMatch() {
    if (!user) return;
    if (queueUnsubRef.current) queueUnsubRef.current();
    queueUnsubRef.current = db.collection("pvpQueue").doc(user.uid).onSnapshot(async snap => {
      if (!snap.exists) return;
      const data = snap.data();
      if (data.status === "matched" && data.gameId) {
        if (queueUnsubRef.current) { queueUnsubRef.current(); queueUnsubRef.current = null; }
        const gameSnap = await db.collection("pvpGames").doc(data.gameId).get();
        if (!gameSnap.exists) return;
        const gameData = gameSnap.data();
        const key = gameData.players?.p1?.uid === user.uid ? "p1" : "p2";
        setMatchmaking(false);
        watchRoom(data.gameId, key);
      }
    }, e => setError(e.message));
  }

  async function findRandomOpponent() {
    if (!user) { onSignIn(); return; }
    setBusy(true); setError("");
    try {
      const myQueueRef = db.collection("pvpQueue").doc(user.uid);

      // Firestore compat transactions cannot read a query directly.
      // Search first, then only read/write specific documents inside the transaction.
      const waitingSnap = await db.collection("pvpQueue")
        .where("status", "==", "waiting")
        .limit(10)
        .get();

      let opponentDoc = null;
      waitingSnap.forEach(doc => {
        const data = doc.data();
        if (!opponentDoc && data.uid !== user.uid) {
          opponentDoc = { id: doc.id, ref: doc.ref, data };
        }
      });

      if (opponentDoc) {
        const gameRef = db.collection("pvpGames").doc();
        const firstDifficulty = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];
        const firstQuestion = getQuestion(firstDifficulty, []);

        await db.runTransaction(async tx => {
          const freshOpponentSnap = await tx.get(opponentDoc.ref);
          if (!freshOpponentSnap.exists) throw new Error("Opponent is no longer available. Tap Find Opponent again.");

          const freshOpponent = freshOpponentSnap.data();
          if (freshOpponent.status !== "waiting" || freshOpponent.uid === user.uid) {
            throw new Error("Opponent is no longer available. Tap Find Opponent again.");
          }

          tx.set(gameRef, {
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            status: "active_speed_round",
            phase: "answering",
            board: Array(9).fill(null),
            lastPlacedHistory: [],
            roundId: 1,
            usedIds: [firstQuestion.id],
            difficulty: firstDifficulty,
            difficultyChooser: null,
            autoFirstRound: true,
            question: firstQuestion,
            questionStartAt: null,
            roundNotice: "First round picked randomly.",
            squarePicker: null,
            attempts: {},
            result: null,
            winnerKey: null,
            loserKey: null,
            finalReason: null,
            statsRecorded: {},
            flagsUsed: { p1:false, p2:false },
            challengeFlagsUsed: {},
            challenge: null,
            matchmaking: true,
            players: {
              p1: { uid: freshOpponent.uid, name: freshOpponent.name || "Player 1", symbol: "X" },
              p2: { uid: user.uid, name: user.name || "Player 2", symbol: "O" },
            }
          });

          tx.set(opponentDoc.ref, {
            status: "matched",
            gameId: gameRef.id,
            matchedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          }, { merge: true });

          tx.set(myQueueRef, {
            uid: user.uid,
            name: user.name || "Player 2",
            status: "matched",
            gameId: gameRef.id,
            matchedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          }, { merge: true });
        });

        setMatchmaking(false);
        watchRoom(gameRef.id, "p2");
      } else {
        await myQueueRef.set({
          uid: user.uid,
          name: user.name || "Player 1",
          status: "waiting",
          gameId: null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
        setMatchmaking(true);
        listenForMatch();
        // If both players tap Find Opponent at the same time, both can land in the queue.
        // Re-check shortly so one waiting player can automatically pair with the other.
        setTimeout(async () => {
          try {
            const freshMe = await myQueueRef.get();
            if (freshMe.exists && freshMe.data().status === "waiting") {
              setBusy(false);
              findRandomOpponent();
            }
          } catch(e) { console.error("auto rematch queue check", e); }
        }, 900);
      }
    } catch(e) { setError(e.message); }
    setBusy(false);
  }

  async function cancelMatchmaking() {
    if (!user) return;
    setBusy(true); setError("");
    try {
      if (queueUnsubRef.current) { queueUnsubRef.current(); queueUnsubRef.current = null; }
      await db.collection("pvpQueue").doc(user.uid).set({
        status: "cancelled",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
      setMatchmaking(false);
    } catch(e) { setError(e.message); }
    setBusy(false);
  }

  async function createGame() {
    if (!user) { onSignIn(); return; }
    setBusy(true); setError("");
    try {
      let code = makeRemoteRoomCode();
      let ref = db.collection("pvpGames").doc(code);
      let snap = await ref.get();
      while (snap.exists) { code = makeRemoteRoomCode(); ref = db.collection("pvpGames").doc(code); snap = await ref.get(); }
      await ref.set({
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        status: "waiting_for_players",
        phase: "waiting",
        board: Array(9).fill(null),
        lastPlacedHistory: [],
        roundId: 0,
        usedIds: [],
        difficulty: "easy",
        difficultyChooser: "p1",
        squarePicker: null,
        attempts: {},
        result: null,
        winnerKey: null,
        loserKey: null,
        finalReason: null,
        statsRecorded: {},
        flagsUsed: { p1:false, p2:false },
        challengeFlagsUsed: {},
        challenge: null,
        players: {
          p1: { uid: user.uid, name: user.name || "Player 1", symbol: "X" },
          p2: null,
        }
      });
      watchRoom(code, "p1");
    } catch(e) { setError(e.message); }
    setBusy(false);
  }

  async function joinGame() {
    if (!user) { onSignIn(); return; }
    const code = joinCode.trim().toUpperCase();
    if (!code) return;
    setBusy(true); setError("");
    try {
      const ref = db.collection("pvpGames").doc(code);
      const snap = await ref.get();
      if (!snap.exists) throw new Error("No game found with that code.");
      const data = snap.data();
      if (data.players?.p1?.uid === user.uid) { watchRoom(code, "p1"); setBusy(false); return; }
      if (data.players?.p2 && data.players.p2.uid !== user.uid) throw new Error("That game is already full.");
      await ref.set({
        status: "active",
        phase: "pickDifficulty",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        players: { ...data.players, p2: { uid: user.uid, name: user.name || "Player 2", symbol: "O" } }
      }, { merge: true });
      watchRoom(code, "p2");
    } catch(e) { setError(e.message); }
    setBusy(false);
  }

  async function pickAsyncDifficulty(diff) {
    if (!game || game.difficultyChooser !== myKey) return;
    setLocalStartedAt(null);
    setLocalSubmitted(false);
    const q = getQuestion(diff, game.usedIds || []);
    await db.collection("pvpGames").doc(roomCode).set({
      phase: "answering",
      status: "active_speed_round",
      difficulty: diff,
      question: q,
      usedIds: [...(game.usedIds || []), q.id],
      attempts: {},
      result: null,
      resolving: false,
      questionStartAt: null,
      roundNotice: null,
      roundId: (game.roundId || 0) + 1,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  }

  async function startMyAttempt() {
    if (!game || !myKey || game.phase !== "answering") return;
    if (myAttempt?.endAt || localSubmitted) return;
    const now = Date.now();
    setLocalStartedAt(now);
    setLocalSubmitted(false);
    setElapsed(0);
    setError("");
    leavingRef.current = false;
    try {
      await db.collection("pvpGames").doc(roomCode).update({
        [`attempts.${myKey}.roundId`]: game.roundId || 0,
        [`attempts.${myKey}.answer`]: null,
        [`attempts.${myKey}.isCorrect`]: false,
        [`attempts.${myKey}.status`]: "started",
        [`attempts.${myKey}.startedAt`]: firebase.firestore.FieldValue.serverTimestamp(),
        [`attempts.${myKey}.endAt`]: null,
        [`attempts.${myKey}.durationMs`]: null,
        [`attempts.${myKey}.leftScreen`]: false,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch(e) {
      setLocalStartedAt(null);
      setError("Ready failed: " + e.message);
    }
  }

  async function submitAsyncAnswer(choice) {
    if (!game || !myKey || game.phase !== "answering") return;
    const currentAttempt = (game.attempts || {})[myKey];
    if ((currentAttempt && currentAttempt.endAt) || localSubmitted) return;
    const isCorrect = choice !== "timeout" && game.question && choice === game.question.a;
    setLocalSubmitted(true);
    setError("");
    try {
      await db.collection("pvpGames").doc(roomCode).update({
        [`attempts.${myKey}.answer`]: choice,
        [`attempts.${myKey}.isCorrect`]: isCorrect,
        [`attempts.${myKey}.status`]: "submitted",
        [`attempts.${myKey}.endAt`]: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch(e) {
      setLocalSubmitted(false);
      setError("Submit failed: " + e.message);
    }
  }

  async function markLeftScreenLoss() {
    if (!roomCode || !myKey) return;
    try {
      await db.collection("pvpGames").doc(roomCode).set({
        phase: "gameOver",
        status: "completed",
        finalReason: "left_screen_loss",
        loserKey: myKey,
        winnerKey: null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
    } catch(e) { console.error("markLeftScreenLoss", e); }
  }

  async function resolveAsyncRound(current) {
    const ref = db.collection("pvpGames").doc(roomCode);
    try {
      await db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists) return;
        const fresh = snap.data();
        if (fresh.phase !== "answering" || fresh.result || fresh.resolving) return;
        const a = fresh.attempts || {};
        if (!a.p1?.startedAt?.toMillis || !a.p1?.endAt?.toMillis || !a.p2?.startedAt?.toMillis || !a.p2?.endAt?.toMillis) return;
        const p1Duration = Math.max(0, a.p1.endAt.toMillis() - a.p1.startedAt.toMillis());
        const p2Duration = Math.max(0, a.p2.endAt.toMillis() - a.p2.startedAt.toMillis());
        const q = fresh.question;
        const p1Correct = a.p1.answer !== "timeout" && a.p1.answer === q.a;
        const p2Correct = a.p2.answer !== "timeout" && a.p2.answer === q.a;
        let roundWinnerKey = null;
        if (p1Correct && p2Correct) roundWinnerKey = p1Duration <= p2Duration ? "p1" : "p2";
        else if (p1Correct) roundWinnerKey = "p1";
        else if (p2Correct) roundWinnerKey = "p2";
        if (!roundWinnerKey) {
          // Both players answered wrong. No square is awarded.
          // Before the first claimed square, the app picks another random opening round.
          if (fresh.autoFirstRound) {
            const nextDiff = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];
            const nextQ = getQuestion(nextDiff, fresh.usedIds || []);
            tx.set(ref, {
              phase: "answering",
              status: "active_speed_round",
              difficulty: nextDiff,
              question: nextQ,
              usedIds: [...(fresh.usedIds || []), nextQ.id],
              attempts: {},
              result: null,
              squarePicker: null,
              resolving: false,
              questionStartAt: null,
              roundId: (fresh.roundId || 0) + 1,
              roundNotice: "Both players missed it. New first round picked randomly.",
              roundNoticeAt: firebase.firestore.FieldValue.serverTimestamp(),
              challenge: null,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            }, { merge: true });
            return;
          }

          // After the first square has been claimed, normal play resumes.
          tx.set(ref, {
            phase: "pickDifficulty",
            status: "active",
            difficultyChooser: fresh.difficultyChooser || "p1",
            attempts: {},
            result: null,
            question: null,
            squarePicker: null,
            resolving: false,
            roundNotice: "Both players missed it. Pick another difficulty.",
            roundNoticeAt: firebase.firestore.FieldValue.serverTimestamp(),
            challenge: null,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          }, { merge: true });
          return;
        }

        tx.set(ref, {
          phase: "roundResult",
          status: "pending_square_selection",
          result: {
            correct: q.a,
            winnerKey: roundWinnerKey,
            noCorrectAnswer: false,
            nextDifficultyChooser: fresh.difficultyChooser || "p1",
            attempts: {
              p1: { ...a.p1, durationMs: p1Duration, isCorrect: p1Correct },
              p2: { ...a.p2, durationMs: p2Duration, isCorrect: p2Correct },
            }
          },
          squarePicker: roundWinnerKey,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      });
    } catch(e) { console.error("resolveAsyncRound", e); }
  }

  async function continueAfterAsyncResult() {
    if (!game?.result) return;
    if (!game.result.winnerKey) {
      const chooser = game.result.nextDifficultyChooser || game.difficultyChooser || "p1";
      await db.collection("pvpGames").doc(roomCode).set({
        phase: "pickDifficulty",
        status: "active",
        difficultyChooser: chooser,
        attempts: {},
        result: null,
        squarePicker: null,
        question: null,
        resolving: false,
        challenge: null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
      return;
    }
    await db.collection("pvpGames").doc(roomCode).set({ phase: "pickSquare", updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  }

  async function pickAsyncSquare(idx) {
    if (!game || game.phase !== "pickSquare" || game.squarePicker !== myKey || game.board[idx]) return;
    const nextBoard = [...game.board];
    nextBoard[idx] = mySymbol;
    const winSymbol = checkWinner(nextBoard);
    const full = nextBoard.every(Boolean);
    const nextHistory = [...(game.lastPlacedHistory || []), { idx, sym: mySymbol, by: myKey }];
    await db.collection("pvpGames").doc(roomCode).set({
      board: nextBoard,
      lastPlacedHistory: nextHistory,
      autoFirstRound: false,
      phase: "remoteFlagWindow",
      status: "challenge_window",
      squarePicker: null,
      challenge: {
        status: "window",
        squareIdx: idx,
        defenderKey: myKey,
        challengerKey: otherKey,
        pendingWinSymbol: winSymbol || null,
        pendingFull: !!full,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  }

  async function finalizeRemoteFlagWindow() {
    if (!game || game.phase !== "remoteFlagWindow" || !game.challenge) return;
    const ch = game.challenge;
    const ref = db.collection("pvpGames").doc(roomCode);
    try {
      await db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists) return;
        const fresh = snap.data();
        if (fresh.phase !== "remoteFlagWindow" || !fresh.challenge || fresh.challenge.status !== "window") return;
        const boardNow = fresh.board || Array(9).fill(null);
        const p1Sym = fresh.players?.p1?.symbol || "X";
        const p2Sym = fresh.players?.p2?.symbol || "O";
        const winSymbol = checkWinner(boardNow);
        const full = boardNow.every(Boolean);
        const update = { updatedAt: firebase.firestore.FieldValue.serverTimestamp(), challenge: null };
        if (winSymbol || full) {
          update.phase = "gameOver";
          update.status = "completed";
          update.finalReason = winSymbol ? "line" : "count";
          update.winnerKey = winSymbol ? (winSymbol === p1Sym ? "p1" : "p2") : null;
          if (!winSymbol && full) {
            const p1Count = boardNow.filter(c => c === p1Sym).length;
            const p2Count = boardNow.filter(c => c === p2Sym).length;
            update.winnerKey = p1Count > p2Count ? "p1" : p2Count > p1Count ? "p2" : null;
          }
        } else {
          update.phase = "pickDifficulty";
          update.status = "active";
          update.difficultyChooser = fresh.challenge.defenderKey || fresh.difficultyChooser || "p1";
          update.squarePicker = null;
          update.attempts = {};
          update.result = null;
          update.resolving = false;
        }
        tx.set(ref, update, { merge: true });
      });
    } catch(e) { setError("Challenge window failed: " + e.message); }
  }

  async function throwRemoteFlag() {
    if (!game || !user || game.phase !== "remoteFlagWindow" || !game.challenge || game.challenge.challengerKey !== myKey) return;
    if (myFlagUsed) return;
    const ref = db.collection("pvpGames").doc(roomCode);
    try {
      let didThrow = false;
      let qForStats = null;
      await db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists) return;
        const fresh = snap.data();
        if (fresh.phase !== "remoteFlagWindow" || !fresh.challenge || fresh.challenge.status !== "window") return;
        if (fresh.challenge.challengerKey !== myKey) return;
        const currentFlags = fresh.flagsUsed || { p1:false, p2:false };
        const currentUidFlags = fresh.challengeFlagsUsed || {};
        if (currentFlags[myKey] || currentUidFlags[user.uid]) return;

        const q = getQuestion(fresh.difficulty || "easy", fresh.usedIds || []);
        qForStats = q;
        didThrow = true;
        tx.set(ref, {
          phase: "remoteChallengeQuestion",
          status: "challenge_question",
          flagsUsed: { ...currentFlags, [myKey]: true },
          challengeFlagsUsed: { ...currentUidFlags, [user.uid]: true },
          usedIds: [...(fresh.usedIds || []), q.id],
          challenge: {
            ...fresh.challenge,
            challengeId: fresh.challenge.challengeId || `${roomCode}_${fresh.roundId || 0}_${Date.now()}`,
            statsRecorded: fresh.challenge.statsRecorded || {},
            status: "defender_answering",
            question: q,
            answer: null,
            isCorrect: null,
            winnerKey: null,
            correct: q.a,
          },
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      });
      if (didThrow && recordFlag && user) recordFlag(user.uid);
    } catch(e) { setError("Challenge flag failed: " + e.message); }
  }

  async function answerRemoteChallenge(choice) {
    if (!game || game.phase !== "remoteChallengeQuestion" || !game.challenge || game.challenge.defenderKey !== myKey) return;
    if (game.challenge.answer !== null && game.challenge.answer !== undefined) return;
    const correct = game.challenge.question?.a;
    const isCorrect = choice === correct;
    const winnerKey = isCorrect ? game.challenge.defenderKey : game.challenge.challengerKey;
    try {
      await db.collection("pvpGames").doc(roomCode).set({
        phase: "remoteChallengeResult",
        status: "challenge_result",
        challenge: {
          ...game.challenge,
          status: "answered",
          answer: choice,
          isCorrect,
          correct,
          winnerKey,
        },
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
    } catch(e) { setError("Challenge answer failed: " + e.message); }
  }

  async function continueRemoteChallengeResult() {
    if (!game || game.phase !== "remoteChallengeResult" || !game.challenge) return;
    const ch = game.challenge;
    const defenderWon = ch.winnerKey === ch.defenderKey;
    const boardNow = game.board || Array(9).fill(null);
    const winSymbol = checkWinner(boardNow);
    if (defenderWon && winSymbol) {
      const p1Sym = game.players?.p1?.symbol || "X";
      const winnerKey = winSymbol === p1Sym ? "p1" : "p2";
      await db.collection("pvpGames").doc(roomCode).set({
        phase: "gameOver",
        status: "completed",
        finalReason: "line",
        winnerKey,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
      return;
    }

    const winnerKey = ch.winnerKey;
    const loserKey = ch.winnerKey === ch.defenderKey ? ch.challengerKey : ch.defenderKey;
    const loserSym = game.players?.[loserKey]?.symbol;
    const loserHasSquare = !!loserSym && boardNow.some(cell => cell === loserSym);

    if (!loserHasSquare) {
      // Challenge winner has no opponent square to erase. Skip erasing and let winner pick next difficulty.
      await db.collection("pvpGames").doc(roomCode).set({
        phase: "pickDifficulty",
        status: "active",
        difficultyChooser: winnerKey,
        squarePicker: null,
        attempts: {},
        result: null,
        challenge: null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
      return;
    }

    await db.collection("pvpGames").doc(roomCode).set({
      phase: "remoteChallengeErase",
      status: "challenge_erase",
      challenge: { ...ch, erasePicker: winnerKey, eraseLoserKey: loserKey },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  }

  async function eraseRemoteChallengeSquare(idx) {
    if (!game || game.phase !== "remoteChallengeErase" || !game.challenge || game.challenge.erasePicker !== myKey) return;
    const loserKey = game.challenge.eraseLoserKey;
    const loserSym = game.players?.[loserKey]?.symbol;
    if (!loserSym || game.board[idx] !== loserSym) return;
    const nextBoard = [...game.board];
    nextBoard[idx] = null;
    const nextHistory = (game.lastPlacedHistory || []).filter(e => e.idx !== idx);
    await db.collection("pvpGames").doc(roomCode).set({
      board: nextBoard,
      lastPlacedHistory: nextHistory,
      phase: "pickDifficulty",
      status: "active",
      difficultyChooser: myKey,
      squarePicker: null,
      attempts: {},
      result: null,
      challenge: null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  }

  async function saveRemoteResultAndMenu() {
    if (!game || !user || !myKey) { onMenu(); return; }
    if (game.statsRecorded?.[myKey]) { onMenu(); return; }
    let result = null;
    if (game.finalReason === "left_screen_loss") {
      if (game.loserKey === myKey) {
        result = "loss";
        if (recordForfeit) await recordForfeit(user.uid);
      }
    } else {
      result = game.winnerKey === myKey ? "win" : game.winnerKey ? "loss" : "cat";
    }
    const mySym = game.players?.[myKey]?.symbol || mySymbol;
    const remoteIsDoubleWin = result === "win" && checkDoubleWin(game.board || [], mySym);
    if (result) await recordResult(result, user.uid, { isDoubleWin: remoteIsDoubleWin });
    await db.collection("pvpGames").doc(roomCode).update({
      [`statsRecorded.${myKey}`]: true,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    onMenu();
  }

  async function rematchSameRoom() {
    if (!game || !myKey) return;
    const firstDifficulty = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];
    const firstQuestion = getQuestion(firstDifficulty, []);
    await db.collection("pvpGames").doc(roomCode).set({
      phase: "answering",
      status: "active_speed_round",
      board: Array(9).fill(null),
      lastPlacedHistory: [],
      roundId: 1,
      usedIds: [firstQuestion.id],
      difficulty: firstDifficulty,
      difficultyChooser: null,
      autoFirstRound: true,
      question: firstQuestion,
      questionStartAt: null,
      squarePicker: null,
      attempts: {},
      result: null,
      winnerKey: null,
      loserKey: null,
      finalReason: null,
      statsRecorded: {},
      flagsUsed: { p1:false, p2:false },
      challengeFlagsUsed: {},
      challenge: null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  }

  if (!user) return (
    <div style={styles.screen}>
      <h2 style={styles.sectionTitle}>Remote Match</h2>
      <p style={styles.bodyText}>Sign in first.</p>
      <button style={{ ...styles.btn, background:"white", color:"#111827" }} onClick={onSignIn}>Sign In With Google</button>
      <button style={{ ...styles.btn, background:"#374151", marginTop:10 }} onClick={onMenu}>Back</button>
    </div>
  );

  if (!game) return (
    <div style={styles.screen}>
      <h2 style={styles.sectionTitle}>Play Remote Match</h2>
      <p style={{ color:"#22C55E", fontWeight:900, marginBottom:10 }}>NO CODE MATCHMAKING v18</p>
      <div style={{ ...styles.card, width:"100%" }}>
        <p style={{ color:"#E5E7EB", fontWeight:800, marginBottom:12 }}>Tap Find Opponent. No room code is needed.</p>
        {!matchmaking ? (
          <button style={{ ...styles.btn, background:"#7C3AED" }} onClick={findRandomOpponent} disabled={busy}>Find Opponent</button>
        ) : (
          <>
            <p style={{ color:"#F59E0B", fontWeight:900, fontSize:18 }}>Searching for opponent...</p>
            <p style={{ color:"#9CA3AF", fontSize:13 }}>You will enter the match automatically when another player joins.</p>
            <button style={{ ...styles.btn, background:"#EF4444", marginTop:10 }} onClick={cancelMatchmaking} disabled={busy}>Cancel Search</button>
          </>
        )}
      </div>
      {error && <p style={{ color:"#EF4444", fontWeight:700 }}>{error}</p>}
      <button style={{ ...styles.btn, background:"#374151", marginTop:10 }} onClick={onMenu}>Back</button>
    </div>
  );

  const p1 = game.players?.p1;
  const p2 = game.players?.p2;
  const bothNames = `${getRemotePlayerName(p1)} vs ${getRemotePlayerName(p2)}`;
  const p1Sym = p1?.symbol || "X";
  const p2Sym = p2?.symbol || "O";
  const mySubmitted = myAttempt?.endAt;
  const otherSubmitted = otherAttempt?.endAt;

  return (
    <div style={styles.screen}>
      <h2 style={styles.sectionTitle}>Remote Match</h2>
      <p style={{ color:"#9CA3AF", marginTop:4 }}>{bothNames}</p>
      <p style={{ color:"#E5E7EB", fontSize:13 }}>You are <strong style={{ color:"#F59E0B" }}>{mySymbol}</strong></p>
      {error && <p style={{ color:"#EF4444", fontWeight:700 }}>{error}</p>}

      {game.phase === "pickDifficulty" && (
        game.difficultyChooser === myKey ?
          <PickDifficultyScreen onPick={pickAsyncDifficulty} playerName={me?.name || "You"} title="Pick Difficulty" /> :
          <WaitingScreen botName={other?.name || "Opponent"} message="is picking difficulty..." board={game.board} playerSymbol={mySymbol} />
      )}

      {game.phase === "answering" && game.question && !myAttempt && (
        <div style={styles.card}>
          <h3 style={{ color:"white", marginBottom:8 }}>{DIFF_LABELS[game.difficulty]} Speed Duel</h3>
          <p style={{ color:"#9CA3AF", fontSize:13, marginBottom:12 }}>Tap Ready when you are ready. Your timer starts then.</p>
          <button style={{ ...styles.btn, background:"#22C55E" }} onClick={startMyAttempt}>Ready to Answer</button>
          <p style={{ color: otherSubmitted ? "#22C55E" : otherAttempt ? "#F59E0B" : "#9CA3AF", fontSize:12, marginTop:12 }}>
            Opponent: {otherSubmitted ? "Submitted" : otherAttempt ? "Answering" : "Not started"}
          </p>
        </div>
      )}

      {game.phase === "answering" && game.question && inCombat && (
        <div style={styles.screen}>
          <div style={{ display:"flex", justifyContent:"space-between", width:"100%", marginBottom:12 }}>
            <span style={styles.timerBadge}>⏱ {(elapsed/1000).toFixed(1)}s</span>
            <span style={{ color: otherSubmitted ? "#22C55E" : "#9CA3AF", fontWeight:700 }}>{otherSubmitted ? "Opponent submitted" : "Opponent pending"}</span>
          </div>
          <p style={{ color:"#EF4444", fontSize:12, fontWeight:800, textAlign:"center" }}>Stay on this screen. Leaving counts as a loss.</p>
          <div style={styles.questionBox}><p style={styles.questionText}>{game.question.q}</p></div>
          <div style={styles.choicesGrid}>
            {game.question.choices.map((c, i) => (
              <button key={i} style={styles.choiceBtn} onClick={() => submitAsyncAnswer(c)}>{c}</button>
            ))}
          </div>
        </div>
      )}

      {game.phase === "answering" && game.question && mySubmitted && (
        <div style={styles.card}>
          <h3 style={{ color:"white", marginBottom:8 }}>Answer submitted</h3>
          <p style={{ color:"#22C55E", fontWeight:800 }}>Your timer stopped.</p>
          <p style={{ color: otherSubmitted ? "#22C55E" : "#F59E0B", fontWeight:700 }}>{otherSubmitted ? "Opponent submitted. Calculating result..." : "Waiting for opponent."}</p>
          <Board board={game.board} playerSymbol={mySymbol} interactive={false} />
        </div>
      )}

      {game.phase === "roundResult" && game.result && (
        <div style={styles.screen}>
          <h3 style={styles.sectionTitle}>Round Result</h3>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, width:"100%" }}>
            <ResultCard name={p1?.name || "Player 1"} answer={game.result.attempts?.p1?.answer === "timeout" ? "⏱" : game.result.attempts?.p1?.answer} time={game.result.attempts?.p1?.durationMs} correct={game.result.correct} isWinner={game.result.winnerKey === "p1"} />
            <ResultCard name={p2?.name || "Player 2"} answer={game.result.attempts?.p2?.answer === "timeout" ? "⏱" : game.result.attempts?.p2?.answer} time={game.result.attempts?.p2?.durationMs} correct={game.result.correct} isWinner={game.result.winnerKey === "p2"} />
          </div>
          <div style={styles.correctAnswerBox}><span style={{ color:"#9CA3AF", fontSize:13 }}>Correct Answer</span><span style={{ color:"#22C55E", fontSize:28, fontWeight:900 }}>{game.result.correct}</span></div>
          {game.result.winnerKey ? <p style={{ color:"#F59E0B", fontWeight:800 }}>{game.players[game.result.winnerKey]?.name} gets the board square.</p> : <p style={{ color:"#EF4444", fontWeight:800 }}>No correct answer. Difficulty chooser picks again.</p>}
          <button style={styles.btn} onClick={continueAfterAsyncResult}>{game.result.winnerKey ? "Continue" : "Pick Again"}</button>
        </div>
      )}

      {game.phase === "pickSquare" && (
        game.squarePicker === myKey ?
          <PickSquareScreen board={game.board} playerSymbol={mySymbol} onPick={pickAsyncSquare} playerName={me?.name || "You"} /> :
          <WaitingScreen botName={other?.name || "Opponent"} message="is choosing a square..." board={game.board} playerSymbol={mySymbol} />
      )}

      {game.phase === "remoteFlagWindow" && game.challenge && (
        <div style={styles.screen}>
          <h3 style={styles.sectionTitle}>Challenge Window</h3>
          <Board board={game.board} playerSymbol={mySymbol} interactive={false} />
          {game.challenge.challengerKey === myKey ? (
            <div style={styles.card}>
              <p style={{ color:"#F59E0B", fontWeight:900 }}>Think they guessed? You have 1 challenge flag per game.</p>
              {myFlagUsed ? (

              )}
              <button style={{ ...styles.btn, background:"#374151", marginTop:10 }} onClick={finalizeRemoteFlagWindow}>Let It Stand</button>
            </div>
          ) : (
            <div style={styles.card}>
              <p style={{ color:"#22C55E", fontWeight:900 }}>Square placed. Opponent has 10 seconds to challenge.</p>
            </div>
          )}
        </div>
      )}

      {game.phase === "remoteChallengeQuestion" && game.challenge && (
        game.challenge.defenderKey === myKey ? (
          <div style={styles.screen}>
            <div style={{ background:"#EF4444", borderRadius:999, padding:"4px 16px", marginBottom:12 }}>
              <p style={{ color:"white", fontWeight:800, fontSize:13, margin:0 }}>🏁 CHALLENGE — Prove You Knew It!</p>
            </div>
            <div style={styles.questionBox}><p style={styles.questionText}>{game.challenge.question.q}</p></div>
            <div style={styles.choicesGrid}>
              {game.challenge.question.choices.map((c, i) => (
                <button key={i} style={styles.choiceBtn} onClick={() => answerRemoteChallenge(c)}>{c}</button>
              ))}
            </div>
          </div>
        ) : (
          <WaitingScreen botName={other?.name || "Opponent"} message="is answering the challenge..." board={game.board} playerSymbol={mySymbol} />
        )
      )}

      {game.phase === "remoteChallengeResult" && game.challenge && (
        <div style={styles.screen}>
          <h3 style={styles.sectionTitle}>Challenge Result</h3>
          <div style={styles.correctAnswerBox}><span style={{ color:"#9CA3AF", fontSize:13 }}>Correct Answer</span><span style={{ color:"#22C55E", fontSize:28, fontWeight:900 }}>{game.challenge.correct}</span></div>
          <p style={{ color: game.challenge.isCorrect ? "#22C55E" : "#EF4444", fontWeight:900 }}>
            {game.challenge.isCorrect ? `${game.players[game.challenge.defenderKey]?.name} proved it.` : `${game.players[game.challenge.challengerKey]?.name} wins the challenge.`}
          </p>
          <button style={styles.btn} onClick={continueRemoteChallengeResult}>Continue</button>
        </div>
      )}

      {game.phase === "remoteChallengeErase" && game.challenge && (
        game.challenge.erasePicker === myKey ? (
          <div style={styles.screen}>
            <h3 style={styles.sectionTitle}>Erase One Opponent Square</h3>
            <div style={styles.board}>
              {game.board.map((cell, i) => {
                const loserSym = game.players?.[game.challenge.eraseLoserKey]?.symbol;
                const canErase = cell === loserSym;
                return (
                  <button key={i} style={{ ...styles.cell, opacity: canErase ? 1 : 0.35, cursor: canErase ? "pointer" : "not-allowed" }} onClick={() => canErase && eraseRemoteChallengeSquare(i)} disabled={!canErase}>
                    {cell && <span style={{ ...styles.cellText, color: cell === mySymbol ? "#EF4444" : "#3B82F6" }}>{cell}</span>}
                  </button>
                );
              })}
            </div>
          </div>
        ) : (
          <WaitingScreen botName={other?.name || "Opponent"} message="is erasing a square..." board={game.board} playerSymbol={mySymbol} />
        )
      )}

      {game.phase === "gameOver" && (
        <div style={styles.screen}>
          <h2 style={styles.sectionTitle}>Game Over</h2>
          <Board board={game.board} playerSymbol={mySymbol} interactive={false} />
          {game.finalReason === "left_screen_loss" ? (
            <p style={{ color:"#EF4444", fontWeight:900, fontSize:18 }}>{game.loserKey === myKey ? "You left the combat screen. Loss recorded." : "Opponent left the combat screen. No win recorded."}</p>
          ) : (
            <p style={{ color:"#F59E0B", fontWeight:900, fontSize:20 }}>{game.winnerKey ? `${game.players[game.winnerKey]?.name} wins!` : "Cat game!"}</p>
          )}

          <button style={{ ...styles.btn, background:"#7C3AED", marginTop:10 }} onClick={rematchSameRoom}>Rematch</button>
        </div>
      )}

      {game.phase !== "gameOver" && <button style={{ ...styles.btn, background:"#374151", marginTop:12 }} onClick={onMenu}>Leave</button>}
    </div>
  );
}

function QuestionScreen({ q, playerAnswer, onAnswer, playerName, botName, weldonAnswered, questionStartTime, questionTimedOut, difficulty }) {
  const [elapsed, setElapsed] = useState(0);
  const LIMIT = QUESTION_TIMEOUTS[difficulty] || 120000;

  useEffect(() => {
    const t = setInterval(() => setElapsed(Date.now() - (questionStartTime || Date.now())), 100);
    return () => clearInterval(t);
  }, [questionStartTime]);

  const remaining = Math.max(0, LIMIT - elapsed);
  const isWarning = remaining < 30000;
  const isUrgent = remaining < 10000;

  if (!q) return null;
  return (
    <div style={styles.screen}>
      <div style={{ display: "flex", justifyContent: "space-between", width: "100%", marginBottom: 16 }}>
        <span style={styles.timerBadge}>⏱ {(elapsed / 1000).toFixed(1)}s</span>
        <span style={{
          fontSize: 13, fontWeight: 700,
          color: isUrgent ? "#EF4444" : isWarning ? "#F59E0B" : "#22C55E",
          animation: isUrgent ? "pulse 0.6s infinite" : "none",
        }}>
          {questionTimedOut ? "⏱ Time's Up!" : weldonAnswered ? "Weldon answered!" : isWarning ? `⚠️ ${(remaining/1000).toFixed(0)}s left` : ""}
        </span>
      </div>
      <div style={styles.questionBox}>
        <p style={styles.questionText}>{q.q}</p>
      </div>
      <div style={styles.choicesGrid}>
        {q.choices.map((c, i) => (
          <button
            key={i}
            style={{
              ...styles.choiceBtn,
              ...(playerAnswer === c ? { background: "#1D4ED8", borderColor: "#60A5FA", transform: "scale(0.97)" } : {}),
              ...(playerAnswer !== null && playerAnswer !== c ? { opacity: 0.5 } : {}),
            }}
            onClick={() => onAnswer(c)}
            disabled={playerAnswer !== null || questionTimedOut}
          >
            {c}
          </button>
        ))}
      </div>
      {isWarning && !questionTimedOut && (
        <p style={{ color: isUrgent ? "#EF4444" : "#F59E0B", fontSize: 12, marginTop: 8, fontWeight: 600 }}>
          {isUrgent ? "Answer now or the round goes to Weldon!" : "Running out of time!"}
        </p>
      )}
    </div>
  );
}
